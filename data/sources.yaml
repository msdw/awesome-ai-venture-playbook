# Sources for automated AI venture discovery
# discover_new_entries.py reads github/hn type sources with search_query.
# Web/reddit sources are for manual review.
#
# Status: active | paused | candidate
# Frequency: daily | weekly

sources:

  # ── GitHub API searches ───────────────────────────────────────────────────────

  github_ai_saas_tools:
    type: github
    description: AI SaaS products and tools being built in Python/TS
    search_query: "ai saas OR llm tool language:python stars:>30"
    frequency: daily
    status: active
    added_at: "2026-05-01"

  github_ai_startup_kit:
    type: github
    description: AI startup boilerplates and venture starters
    search_query: "ai startup kit OR llm starter OR saas boilerplate ai stars:>50"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  github_mvp_ai:
    type: github
    description: MVP-stage AI products — small teams, fast execution
    search_query: "ai mvp OR minimum viable product ai language:typescript stars:>20"
    frequency: daily
    status: active
    added_at: "2026-06-01"

  github_awesome_saas:
    type: github
    description: Awesome SaaS and startup resource lists
    search_query: "awesome saas OR awesome startup tools OR awesome indie hacker"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  # ── Hacker News ───────────────────────────────────────────────────────────────

  hn_show_saas:
    type: hn
    description: Show HN — newly launched SaaS products
    search_query: "Show HN SaaS"
    frequency: daily
    status: active
    added_at: "2026-05-01"
    notes: Most relevant signal — real products with first-week community feedback

  hn_show_ai_product:
    type: hn
    description: Show HN — AI products and demos
    search_query: "Show HN AI product"
    frequency: daily
    status: active
    added_at: "2026-06-01"

  hn_ask_building:
    type: hn
    description: Ask HN — what are you building with AI
    search_query: "Ask HN what are you building"
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  hn_launch_week:
    type: hn
    description: HN threads about product launches and YC batches
    search_query: "YC batch launch AI startup"
    frequency: weekly
    status: active
    added_at: "2026-06-01"

  # ── Web sources (manual review) ───────────────────────────────────────────────

  indie_hackers_products:
    type: web
    description: Indie Hackers new products — revenue-first AI ventures
    url: "https://www.indiehackers.com/products?sorting=newest"
    frequency: weekly
    status: active
    added_at: "2026-05-01"
    notes: Best for revenue-validated AI micro-ventures

  ycombinator_companies:
    type: web
    description: YC AI companies — validated by top accelerator
    url: "https://www.ycombinator.com/companies?industry=Artificial+Intelligence&batch=&status=&isHiring=&nonprofit=&query="
    frequency: weekly
    status: active
    added_at: "2026-05-26"

  producthunt_ai:
    type: producthunt
    description: Product Hunt AI launches — newest products
    url: "https://www.producthunt.com/topics/artificial-intelligence?order=newest"
    frequency: weekly
    status: active
    added_at: "2026-05-01"

  crunchbase_ai_seed:
    type: web
    description: Crunchbase early-stage AI funding signals
    url: "https://news.crunchbase.com/ai-robotics/"
    frequency: weekly
    status: paused
    added_at: "2026-05-26"
    notes: Paused — funding news lags product reality; re-enable for market sizing

  # ── Curated directories (reviewed by hand, not used as API queries) ──────────

  awesome_oss_alternatives:
    type: web
    description: Open-source alternatives to established commercial SaaS products
    url: "https://github.com/RunaCapital/awesome-oss-alternatives"
    frequency: weekly
    status: active
    added_at: "2026-08-22"
    notes: Reviewed manually — an open-source alternative with traction marks a wedge worth pricing

  awesome_open_ai_developer_tools:
    type: web
    description: Curated directory of open-source AI devtools, local LLMs and SaaS alternatives
    url: "https://github.com/Sami-Uysal/awesome-open-ai-developer-tools"
    frequency: weekly
    status: active
    added_at: "2026-08-22"
    notes: Reviewed manually — shared with the Idea Engine sources list

  github_composiohq_awesome_claude_skills:
    type: github
    description: A curated list of awesome Claude Skills, resources, and tools for customizing
      Claude AI workflows
    url: https://github.com/ComposioHQ/awesome-claude-skills
    found_by_query: awesome saas resources list
    frequency: weekly
    status: candidate
    stars: 74572
    added_at: '2026-09-06'
  github_edostra_marketing_for_founders:
    type: github
    description: Practical marketing resources to get the first 10 / 100 / 1000 users
      for your SaaS / App / Startup
    url: https://github.com/EdoStra/Marketing-for-Founders
    found_by_query: awesome saas resources list
    frequency: weekly
    status: candidate
    stars: 6857
    added_at: '2026-09-06'
  github_ishanvyas22_awesome_open_source_systems:
    type: github
    description: ':sunglasses: A curated list of awesome Free Open Source Softwares(FOSS).'
    url: https://github.com/ishanvyas22/awesome-open-source-systems
    found_by_query: awesome saas resources list
    frequency: weekly
    status: candidate
    stars: 650
    added_at: '2026-09-06'
  github_layr_labs_awesome_avs:
    type: github
    description: A curated list of awesome projects and resources related to AVS development
      and EigenLayer.
    url: https://github.com/Layr-Labs/awesome-avs
    found_by_query: awesome saas resources list
    frequency: weekly
    status: candidate
    stars: 178
    added_at: '2026-09-06'
