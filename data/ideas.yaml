# Curated AI ideas — venture-focused
ideas:
  - id: ai_sales_call_coach
    title: AI sales call coaching tool
    summary: >
      Real-time or post-call AI coach that analyzes sales calls, identifies
      objection handling gaps, scores call quality, and provides specific
      improvement suggestions.
    category: ai_saas
    target_users:
      - sales
      - startup_founder
    target_buyers:
      - Sales managers
      - B2B SaaS companies
    industries:
      - marketing
    pain_points:
      - Sales managers cannot listen to all calls
      - Reps repeat the same mistakes without feedback
      - Coaching takes hours of manager time
    ai_solution:
      - Transcribe and analyze call recordings
      - Score objection handling, talk time ratio, question quality
      - Generate specific, actionable coaching feedback
    possible_business_models:
      - subscription_saas
      - usage_based_api
    technical_stack:
      - speech_to_text
      - llm_api
      - analytics
    validation_steps:
      - Interview 10 sales managers about their coaching workflow
      - Ask for examples of call recordings and current feedback process
      - Prototype with sample transcripts
      - Measure perceived quality of AI-generated feedback
    difficulty: medium
    time_to_mvp: "4-8 weeks"
    risk_level: medium
    scoring:
      pain_intensity: 8
      willingness_to_pay: 8
      ai_fit: 9
      buildability: 7
    tags:
      - sales_automation
      - b2b
    source: community
    status: accepted

