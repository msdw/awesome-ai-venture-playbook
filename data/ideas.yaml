  - id: ai_reversible_agent_runner
    title: Reversible execution layer for AI agents
    summary: >
      A runner that snapshots every file and shell action an agent takes so any run
      can be rolled back in one command, making it safe to let agents act on a real
      working tree instead of a sandbox copy.
    category: ai_infrastructure
    target_users:
      - developer
      - startup_founder
      - operations
    target_buyers:
      - Engineering teams adopting coding agents
      - Platform teams
    industries:
      - software_dev
      - operations
    pain_points:
      - Teams keep agents in read-only mode because a bad run is not reversible
      - Reviewing an agent's 40-file change is slower than undoing it and retrying
      - Shell side effects are invisible in a git diff
    ai_solution:
      - Snapshot the working tree and shell state before each agent action
      - Summarise what a run changed and offer a single rollback point
      - Flag actions that touch paths outside the declared scope
    possible_business_models:
      - open_source_commercial_layer
      - subscription_saas
      - enterprise_license
    technical_stack:
      - llm_api
      - data_pipeline
      - database_backend
    validation_steps:
      - Interview 10 teams about why their agents run read-only
      - Measure how often a rollback is used over 2 weeks on one team
      - Test whether rollback coverage changes what teams let agents touch
    difficulty: medium
    time_to_mvp: "4-6 weeks"
    risk_level: medium
    scoring:
      pain_intensity: 8
      willingness_to_pay: 7
      ai_fit: 5
      buildability: 6
    tags:
      - developer_tools
      - automation
