  - id: ai_customer_feedback_synthesizer
    title: AI customer feedback synthesizer
    summary: >
      Aggregates and synthesizes customer feedback from multiple sources (support tickets,
      reviews, surveys, NPS responses) into structured insights, themes, and priority signals.
    category: ai_data
    target_users:
      - product_manager
      - startup_founder
    target_buyers:
      - Product teams
      - Customer success teams
    industries:
      - software_dev
      - ecommerce
    pain_points:
      - Product teams are overwhelmed by unstructured feedback
      - Key signals get buried in ticket volumes
      - Synthesizing feedback manually takes days
    ai_solution:
      - Ingest feedback from Zendesk, Intercom, App Store, Trustpilot
      - Cluster into themes and pain categories
      - Score sentiment and frequency
      - Surface top 5 actionable signals per week
    ai_patterns:
      - nlp_processing
      - classification
      - summarization
    possible_business_models:
      - subscription_saas
      - usage_based_api
    difficulty: medium
    time_to_mvp: "4-6 weeks"
    risk_level: low
    scoring:
      pain_intensity: 9
      willingness_to_pay: 8
      ai_fit: 9
      buildability: 7
    tags:
      - data_analysis
      - b2b
      - automation
    source: community
    status: accepted

  - id: ai_knowledge_base_builder
    title: AI knowledge base builder from existing docs
    summary: >
      Transforms a company's existing documentation (PDFs, Notion, Confluence, Docs)
      into a searchable, conversational knowledge base that answers employee or customer questions.
    category: ai_saas
    target_users:
      - operations
      - developer
    target_buyers:
      - SMBs with growing teams
      - Customer support teams
      - HR departments
    industries:
      - software_dev
      - operations
      - customer_service
    pain_points:
      - Employees repeat questions that are already documented
      - Finding the right document takes too long
      - Onboarding new hires is slow and inconsistent
    ai_solution:
      - Ingest documents via upload or connector
      - Build vector index for semantic search
      - Provide chat interface with cited answers
    ai_patterns:
      - rag_assistant
      - semantic_search
    possible_business_models:
